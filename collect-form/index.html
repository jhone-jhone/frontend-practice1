<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>关于杀戮尖塔Ⅱ的信息收集</title>
        <link rel="stylesheet" href="mycss.css">
    </head>
<body>
    <header>
        <h1>杀戮尖塔Ⅱ信息收集</h1>
        <p>一份简单的调查(从信息中得到方法)</p>
    </header>
    <nav>
        <a href="#intro">填写说明</a>
        <a href="#form">开始填写</a>
    </nav>
    <main>
        <section id="intro">
            <h2>填写说明</h2>
            <p>希望你能提出你宝贵的想法，让我们借鉴学习</p>
        </section>
        <section id="form">
            <h2>方法收集表</h2>
            <p>表单在这里填写</p>
            <form action="#" method="get">
                <p>
                    <label for="name">姓名（可填昵称）</label>
                    <input type="text" id="name" name="name" placeholder="填写你的姓名" required>
                </p>
                <p>
                    <label for="mail">邮箱</label>
                    <input type="email" id="mail" name="email" required>
                </p>
                <p>你喜欢的卡组大小</p>
                <label><input type="radio" name="number" value="3" checked>大卡组</label>
                <label><input type="radio" name="number" value="2" >小卡组</label>
                <label><input type="radio" name="number" value="1" >根据具体情况决定</label>
                <p>你喜欢的英雄(多选)</p>
                <p>
                    <label><input type="checkbox" name="charact" value="zhanshi">战士</label>
                    <label><input type="checkbox" name="charact" value="lieren">猎人</label>
                    <label><input type="checkbox" name="charact" value="gumei">骨妹</label>
                    <label><input type="checkbox" name="charact" value="chujun">储君</label>
                    <label><input type="checkbox" name="charact" value="jibao">机宝</label>
                </p>
                <p>
                    <label for="playdate">最近一次游玩时间</label>
                    <input type="date" id="playdate" name="playdate">
                </p>
                <p>
                    <label for="advice">请写出你对杀戮尖塔Ⅱ的理解（可以附带链接）</label><br>
                    <textarea id="advice" name="advice" rows="4" maxlength="200" placeholder="随便说点"></textarea>
                </p>
                <p><button type="submit">提交表单</button></p>
            </form>
        </section>
    </main>
    <footer>
        <p>软件开发实践·自主实践</p>
    </footer>
</body>
</html>
